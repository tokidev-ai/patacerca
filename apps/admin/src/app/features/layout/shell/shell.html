<div class="min-h-screen md:grid md:grid-cols-[250px_1fr]">
  <!-- Móvil: barra superior fija (logo + salir + pestañas). Escritorio: barra lateral. -->
  <aside
    class="bg-ink text-bg sticky top-0 z-10 border-b border-white/10 md:h-screen md:border-r md:border-b-0"
  >
    <div
      class="flex flex-wrap items-center justify-between gap-y-2.5 px-4 pt-3 pb-2.5 md:h-full md:flex-col md:items-stretch md:justify-start md:gap-7 md:px-5 md:py-6"
    >
      <div class="font-display order-1 flex items-center gap-2 text-[19px] font-bold">
        <span class="bg-brand size-3 rounded-full"></span>
        patacerca <em class="font-medium text-[#a99b8c] not-italic">admin</em>
      </div>

      <button
        type="button"
        class="text-card order-2 inline-flex cursor-pointer items-center gap-2 rounded-xl bg-white/12 px-3.5 py-2 text-sm font-semibold transition-colors hover:bg-white/20 md:order-4 md:justify-center md:py-2.5"
        (click)="logout()"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" x2="9" y1="12" y2="12" />
        </svg>
        Cerrar sesión
      </button>

      <nav class="order-3 flex w-full gap-1.5 md:order-2 md:flex-col md:gap-1">
        <a
          routerLink="/dashboard"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="aria-[current=page]:bg-brand aria-[current=page]:text-card flex flex-1 items-center justify-center rounded-xl px-3.5 py-2.5 font-medium text-[#d9ccb8] hover:bg-white/10 md:flex-none md:justify-between"
        >
          Dashboard
        </a>
        <a
          routerLink="/solicitudes"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="group aria-[current=page]:bg-brand aria-[current=page]:text-card flex flex-1 items-center justify-center gap-2 rounded-xl px-3.5 py-2.5 font-medium text-[#d9ccb8] hover:bg-white/10 md:flex-none md:justify-between"
        >
          Solicitudes
          @if (walkers.inReview().length > 0) {
            <span
              class="bg-amber text-card group-aria-[current=page]:text-brand-dark group-aria-[current=page]:bg-card rounded-full px-2 text-xs font-semibold"
            >
              {{ walkers.inReview().length }}
            </span>
          }
        </a>
        <a
          routerLink="/usuarios"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="aria-[current=page]:bg-brand aria-[current=page]:text-card flex flex-1 items-center justify-center rounded-xl px-3.5 py-2.5 font-medium text-[#d9ccb8] hover:bg-white/10 md:flex-none md:justify-between"
        >
          Usuarios
        </a>
        <a
          routerLink="/zonas"
          routerLinkActive
          ariaCurrentWhenActive="page"
          class="aria-[current=page]:bg-brand aria-[current=page]:text-card flex flex-1 items-center justify-center rounded-xl px-3.5 py-2.5 font-medium text-[#d9ccb8] hover:bg-white/10 md:flex-none md:justify-between"
        >
          Zonas
        </a>
      </nav>

      <div
        class="hidden rounded-xl bg-white/6 px-3.5 py-3 text-[13px] md:order-3 md:mt-auto md:block"
      >
        <span class="block text-[#a99b8c]">Sesión iniciada como</span>
        <span class="block font-semibold break-all">{{ auth.user()?.email }}</span>
      </div>
    </div>
  </aside>

  <section class="min-w-0">
    <router-outlet />
  </section>
</div>
