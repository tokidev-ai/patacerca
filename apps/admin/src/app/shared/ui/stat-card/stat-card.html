<div
  class="flex h-full flex-col gap-2 rounded-2xl border p-5"
  [class]="highlight() ? 'border-brand bg-brand text-card' : 'border-line bg-card'"
>
  <span class="text-sm" [class]="highlight() ? 'text-brand-soft' : 'text-ink-soft'">
    {{ label() }}
  </span>
  <strong class="font-display text-4xl leading-none">{{ value() }}</strong>
</div>
