<div
  class="bg-ink/50 fixed inset-0 z-50 flex items-center justify-center p-6"
  role="dialog"
  aria-modal="true"
  (click)="cancel()"
  (keydown.escape)="cancel()"
  tabindex="-1"
>
  <div
    class="bg-card w-full max-w-sm rounded-3xl p-6 text-center shadow-xl"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    role="document"
  >
    <div
      class="mx-auto mb-3.5 flex size-13 items-center justify-center rounded-full"
      [class]="tone() === 'danger' ? 'bg-danger-soft text-danger' : 'bg-brand-soft text-brand'"
    >
      @if (tone() === 'danger') {
        <svg
          class="size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
          />
          <line x1="12" x2="12" y1="9" y2="13" />
          <line x1="12" x2="12.01" y1="17" y2="17" />
        </svg>
      } @else {
        <svg
          class="size-6"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
      }
    </div>

    <h2 class="font-display text-xl font-bold">{{ title() }}</h2>
    @if (message()) {
      <p class="text-ink-soft mt-2">{{ message() }}</p>
    }

    <div class="mt-6 flex gap-2.5">
      <button
        type="button"
        class="border-ink flex-1 cursor-pointer rounded-full border-[1.5px] px-4 py-2.5 font-semibold disabled:opacity-50"
        [disabled]="busy()"
        (click)="cancel()"
      >
        {{ cancelLabel() }}
      </button>
      <button
        type="button"
        class="text-card inline-flex flex-1 cursor-pointer items-center justify-center gap-2 rounded-full px-4 py-2.5 font-semibold disabled:opacity-70"
        [class]="tone() === 'danger' ? 'bg-danger' : 'bg-brand'"
        [disabled]="busy()"
        (click)="confirmed.emit()"
      >
        @if (busy()) {
          <span
            class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
          ></span>
        }
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
</div>
